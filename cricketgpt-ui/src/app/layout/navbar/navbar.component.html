<nav class="navbar">
  <div class="navbar-inner">
    
    <!-- Premium Brand Logo -->
    <a class="brand" routerLink="/">
      <div class="brand-visual">
        <span class="brand-gradient-orb"></span>
        <i class="fa-solid fa-baseball-bat-ball brand-logo-icon"></i>
      </div>
      <span class="brand-name">
        Cricket<span class="brand-accent">GPT</span>
      </span>
      <span class="brand-badge">AI</span>
    </a>

    <!-- High-End Segmented Navigation Control -->
    <div class="nav-links">
      <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        <i class="fa-solid fa-house nav-icon"></i>
        <span>Home</span>
      </a>
    </div>

    <!-- Minimalist Dark/Light Toggle Trigger -->
    <button 
      class="theme-btn" 
      (click)="themeService.toggle()" 
      [title]="themeService.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
      aria-label="Toggle theme"
    >
      @if (themeService.theme() === 'dark') {
        <i class="fa-regular fa-sun theme-icon sun-spin"></i>
      } @else {
        <i class="fa-regular fa-moon theme-icon moon-drift"></i>
      }
    </button>

  </div>
</nav>
